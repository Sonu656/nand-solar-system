<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Nand Solar Enquiry Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7f9;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 400px;
        margin: 50px auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        color: #2c3e50;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    textarea {
        resize: none;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #27ae60;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #219150;
    }
</style>
</head>

<body>

<div class="container">
    <h2> Nand Solar Enquiry Form</h2>

    <form>
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Mobile Number</label>
        <input type="tel" name="mobile" placeholder="Enter mobile number" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email">

        <label>Location</label>
        <input type="text" name="location" placeholder="City / Area">

        <label>Type of Property</label>
        <select name="property">
            <option>Residential</option>
            <option>Commercial</option>
            <option>Industrial</option>
        </select>

        <label>Electricity Bill (Monthly ₹)</label>
        <input type="number" name="bill" placeholder="Approx bill">

        <label>Requirement</label>
        <select name="requirement">
            <option>On-Grid Solar</option>
            <option>Off-Grid Solar</option>
            <option>Hybrid Solar</option>
        </select>

        <label>Message</label>
        <textarea name="message" rows="3" placeholder="Any additional details"></textarea>

        <button type="submit">Submit Enquiry</button>
    </form>
</div>

</body>
</html>
